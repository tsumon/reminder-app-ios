name: ReminderApp
options:
  bundleIdPrefix: com.reminder
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    INFOPLIST_FILE: ReminderApp/Info.plist
    DEVELOPMENT_TEAM: ""

targets:
  ReminderApp:
    type: application
    platform: iOS
    sources:
      - path: ReminderApp
    entitlements:
      path: ReminderApp/ReminderApp.entitlements
    dependencies:
      - target: ReminderWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reminder.app
        PRODUCT_NAME: "循环提醒"
        INFOPLIST_FILE: ReminderApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false

  ReminderWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ReminderWidget
      - path: ReminderApp/Services/WidgetSnapshot.swift
    entitlements:
      path: ReminderWidget/ReminderWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reminder.app.widget
        PRODUCT_NAME: "ReminderWidget"
        INFOPLIST_FILE: ReminderWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: ReminderWidget/Info.plist
      properties:
        CFBundleDisplayName: 循环提醒小组件
        CFBundleShortVersionString: "1.7.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
