name: ReminderApp
options:
  bundleIdPrefix: com.reminder
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentRegion: zh-Hans
  knownRegions:
    - zh-Hans
    - en
    - zh-Hant
    - ja
    - ko

settings:
  base:
    SWIFT_VERSION: "5.9"
    INFOPLIST_FILE: ReminderApp/Info.plist
    DEVELOPMENT_TEAM: ""

targets:
  ReminderApp:
    type: application
    platform: iOS
    sources:
      - path: ReminderApp
      - path: ReminderApp/Services/Localization.swift
      - path: ReminderApp/Resources/Localizable.xcstrings
    entitlements:
      path: ReminderApp/ReminderApp.entitlements
    dependencies:
      - target: ReminderWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reminder.app
        PRODUCT_NAME: "循环提醒"
        INFOPLIST_FILE: ReminderApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - LunarCalendarCheck

  # 纯逻辑回归检查：macOS 命令行工具（无需 iOS 模拟器/host app），
  # 直接编译产品代码并断言事实，CI 里 build + run。
  # 覆盖：LunarCalendar（权威农历事实）+ RetrySchedule（双端递增重试时间轴）。
  LunarCalendarCheck:
    type: tool
    platform: macOS
    sources:
      - path: ReminderApp/Services/LunarCalendar.swift
      - path: ReminderApp/Services/RetrySchedule.swift
      - path: ReminderAppTests/LunarCalendarCheckMain.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reminder.lunarchk
        GENERATE_INFOPLIST_FILE: "YES"

  ReminderWidget:
    type: app-extension
    platform: iOS
    sources:
      # Info.plist 已作为实体文件提交进仓库（与下面的 info: 块保持同步）。
      # 必须从 sources 排除，否则会被当作资源再拷贝一次，
      # 触发 "Multiple commands produce .../Info.plist" 构建错误。
      - path: ReminderWidget
        excludes:
          - "Info.plist"
      - path: ReminderApp/Services/WidgetSnapshot.swift
      # v1.8.7: 小组件显示今天农历 → 引入农历转换器（自包含，仅依赖 Foundation）
      - path: ReminderApp/Services/LunarCalendar.swift
      # 多语言：小组件内文案同样需要本地化（扩展用自己的 main bundle）
      - path: ReminderApp/Services/Localization.swift
      - path: ReminderApp/Resources/Localizable.xcstrings
    entitlements:
      path: ReminderWidget/ReminderWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reminder.app.widget
        PRODUCT_NAME: "ReminderWidget"
        INFOPLIST_FILE: ReminderWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: ReminderWidget/Info.plist
      properties:
        CFBundleDisplayName: 循环提醒小组件
        CFBundleShortVersionString: "2.0.11"
        CFBundleVersion: "35"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
