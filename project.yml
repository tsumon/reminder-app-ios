name: ReminderApp
options:
  bundleIdPrefix: com.reminder
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentRegion: zh-Hans
  knownRegions:
    - zh-Hans
    - en
    - zh-Hant
    - ja
    - ko

settings:
  base:
    SWIFT_VERSION: "5.9"
    INFOPLIST_FILE: ReminderApp/Info.plist
    DEVELOPMENT_TEAM: ""

targets:
  ReminderApp:
    type: application
    platform: iOS
    sources:
      - path: ReminderApp
      - path: ReminderApp/Services/Localization.swift
      - path: ReminderApp/Resources/Localizable.xcstrings
    entitlements:
      path: ReminderApp/ReminderApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.reminder.app
    dependencies:
      - target: ReminderWidget
        embed: true
    settings:
      base:
        SDKROOT: "iphoneos"
        PRODUCT_BUNDLE_IDENTIFIER: com.reminder.app
        PRODUCT_NAME: "循环提醒"
        # v2.2.1: 补 App 图标编译设置——缺失导致 Assets.car 无 AppIcon、桌面图标空白
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: ReminderApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - LunarCalendarCheck
        - ReminderAppUITests

  # v2.4.7: UI 自动化回归（模拟器真实全链路：tap/type/重启断言）
  ReminderAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReminderAppUITests
    dependencies:
      - target: ReminderApp
    settings:
      base:
        SDKROOT: "iphoneos"
        TEST_TARGET_NAME: ReminderApp
        PRODUCT_NAME: ReminderAppUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.reminder.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"

  # 纯逻辑回归检查：macOS 命令行工具（无需 iOS 模拟器/host app），
  # 直接编译产品代码并断言事实，CI 里 build + run。
  # 覆盖：LunarCalendar（权威农历事实）+ RetrySchedule（双端递增重试时间轴）。
  LunarCalendarCheck:
    type: tool
    platform: macOS
    sources:
      - path: ReminderApp/Services/LunarCalendar.swift
      - path: ReminderApp/Services/RetrySchedule.swift
      - path: ReminderAppTests/LunarCalendarCheckMain.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reminder.lunarchk
        PRODUCT_NAME: "LunarCalendarCheck"
        GENERATE_INFOPLIST_FILE: "YES"

  # v2.4.7: AI 对话历史持久化回归检查（macOS 命令行工具）。
  # 背景：用户反馈 v2.4.7 后 iOS 历史仍失效——往返/截断/容错断言锁定存储层。
  ChatHistoryCheck:
    type: tool
    platform: macOS
    sources:
      - path: ReminderApp/Services/ChatHistoryStore.swift
      - path: ReminderAppTests/ChatHistoryCheckMain.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reminder.chathistchk
        PRODUCT_NAME: "ChatHistoryCheck"
        GENERATE_INFOPLIST_FILE: "YES"

  # 阶段2: 跨端备份/同步协议回归检查（macOS 命令行工具，CI 里 build + run）。
  # fixture 与 Android 仓库 app/src/test/resources/fixtures/ 内容一致（双端共享 golden fixture）。
  BackupProtocolCheck:
    type: tool
    platform: macOS
    sources:
      - path: ReminderApp/Models/Reminder.swift
      - path: ReminderApp/Services/SyncStore.swift
      - path: ReminderApp/Services/BackupHelper.swift
      - path: ReminderApp/Services/Localization.swift
      - path: ReminderApp/Services/HolidayService.swift
      - path: ReminderApp/Services/LunarCalendar.swift
      - path: ReminderAppTests/TestShims.swift
      - path: ReminderAppTests/BackupProtocolCheckMain.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reminder.protocolchk
        PRODUCT_NAME: "BackupProtocolCheck"
        GENERATE_INFOPLIST_FILE: "YES"

  ReminderWidget:
    type: app-extension
    platform: iOS
    sources:
      # Info.plist 已作为实体文件提交进仓库（与下面的 info: 块保持同步）。
      # 必须从 sources 排除，否则会被当作资源再拷贝一次，
      # 触发 "Multiple commands produce .../Info.plist" 构建错误。
      - path: ReminderWidget
        excludes:
          - "Info.plist"
      - path: ReminderApp/Services/WidgetSnapshot.swift
      # v1.8.7: 小组件显示今天农历 → 引入农历转换器（自包含，仅依赖 Foundation）
      - path: ReminderApp/Services/LunarCalendar.swift
      # 多语言：小组件内文案同样需要本地化（扩展用自己的 main bundle）
      - path: ReminderApp/Services/Localization.swift
      - path: ReminderApp/Resources/Localizable.xcstrings
    entitlements:
      path: ReminderWidget/ReminderWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.reminder.app
    settings:
      base:
        SDKROOT: "iphoneos"
        PRODUCT_BUNDLE_IDENTIFIER: com.reminder.app.widget
        PRODUCT_NAME: "ReminderWidget"
        INFOPLIST_FILE: ReminderWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: ReminderWidget/Info.plist
      properties:
        CFBundleDisplayName: 循环提醒小组件
        CFBundleShortVersionString: "2.4.7"
        CFBundleVersion: "56"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
