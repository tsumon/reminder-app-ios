name: Build iOS IPA

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Fix Homebrew tap trust issue
        run: brew untap aws/tap 2>/dev/null; true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run lunar calendar regression check
        run: |
          # macOS 命令行工具：无需 iOS 模拟器（runner 无预建设备且部分 runtime 不兼容），
          # 直接编译产品代码 LunarCalendar.swift 跑权威农历事实断言
          xcodebuild build \
            -project ReminderApp.xcodeproj \
            -scheme LunarCalendarCheck \
            -destination 'platform=macOS' \
            -derivedDataPath ./DerivedDataTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
          BIN=$(find ./DerivedDataTests/Build/Products -name 'LunarCalendarCheck' -type f | head -1)
          echo "Running: $BIN"
          "$BIN"

      - name: Run chat history persistence check
        # v2.4.6: AI 对话历史 save→load 往返/截断/容错回归
        run: |
          xcodebuild build \
            -project ReminderApp.xcodeproj \
            -scheme ChatHistoryCheck \
            -destination 'platform=macOS' \
            -derivedDataPath ./DerivedDataTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
          BIN=$(find ./DerivedDataTests/Build/Products -name 'ChatHistoryCheck' -type f | head -1)
          echo "Running: $BIN"
          "$BIN"

      - name: Run protocol, policy, action and populated migration checks
        run: |
          set -euo pipefail
          for SCHEME in BackupProtocolCheck SixFeaturesCheck UpgradeCheck LegacyStoreProducer MigrationCheck; do
            xcodebuild build -project ReminderApp.xcodeproj -scheme "$SCHEME" -destination 'platform=macOS' -derivedDataPath ./DerivedDataChecks CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          done
          ./DerivedDataChecks/Build/Products/Debug/BackupProtocolCheck
          ./DerivedDataChecks/Build/Products/Debug/SixFeaturesCheck
          ./DerivedDataChecks/Build/Products/Debug/UpgradeCheck
          ./DerivedDataChecks/Build/Products/Debug/LegacyStoreProducer "$RUNNER_TEMP/reminder-v272.store"
          ./DerivedDataChecks/Build/Products/Debug/MigrationCheck "$RUNNER_TEMP/reminder-v272.store"

      - name: Upload actual cross-platform backup export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-protocol-v3-export
          path: ios-export-v3.json
          if-no-files-found: warn

      - name: Upload Android to iOS production roundtrip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ios-roundtrip-v3
          path: android-ios-roundtrip-v3.json
          if-no-files-found: warn

      - name: Download iOS Simulator runtime
        # actool (AssetCatalogSimulatorAgent) 需要 iOS 模拟器运行时才能编译 Assets.xcassets，
        # macOS runner 默认未安装，会导致 archive 阶段 "No simulator runtime version ... available" 失败。
        run: |
          # macos-15 runner 偶发网络中断导致 exit 70（"Unable to connect to simulator"），
          # 与代码无关；自愈重试最多 3 次，避免手动 rerun。
          for i in 1 2 3; do
            echo "Attempt $i: xcodebuild -downloadPlatform iOS"
            if xcodebuild -downloadPlatform iOS; then
              echo "downloadPlatform ok"
              break
            fi
            echo "downloadPlatform failed (exit $?), retrying in 10s..."
            sleep 10
          done
          xcrun simctl list runtimes

      - name: Build (archive, no signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ReminderApp.xcodeproj \
            -scheme ReminderApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/ReminderApp.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log
          echo "=== BUILD LOG (last 100 lines) ==="
          tail -100 build.log

      - name: Run simulator regression tests
        run: |
          set -euo pipefail
          python3 ReminderAppUITests/MockAIServer.py > "$RUNNER_TEMP/reminder-mock.log" 2>&1 &
          python3 - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8898/v1/models', timeout=2) as response:
                      models=json.load(response)
                  assert any(item['id']=='llama3.2' for item in models['data'])
                  with urllib.request.urlopen('http://127.0.0.1:8899/state', timeout=2) as response:
                      assert 'entries' in json.load(response)
                  print('Both model8898 and scripted AI/WebDAV8899 fixtures ready')
                  break
              except Exception:
                  if attempt == 29: raise
                  time.sleep(1)
          PY
          python3 - <<'PY'
          import json, subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          chosen=next((d['udid'] for group in devices.values() for d in group if 'iPhone' in d['name']),None)
          if not chosen: raise SystemExit('No available iPhone simulator')
          with open('simulator-id.txt','w') as f: f.write(chosen)
          PY
          xcodebuild test -project ReminderApp.xcodeproj -scheme ReminderApp -destination "platform=iOS Simulator,id=$(cat simulator-id.txt)" -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Export UI screenshot and failure attachments
        if: always()
        run: |
          set -euo pipefail
          # Apple documents export attachments and recommends CLI help for installed tool details.
          # https://developer.apple.com/documentation/xcode-release-notes/xcode-16_3-release-notes
          xcrun xcresulttool help export attachments | tee xcresult-attachments-help.txt
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path UIAttachments 2>&1 | tee xcresult-attachments-export.log
          else
            echo "No xcresult bundle was produced; retaining build and test failure logs."
          fi

      - name: Upload exported UI attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-attachments
          path: |
            UIAttachments
            xcresult-attachments-help.txt
            xcresult-attachments-export.log
          if-no-files-found: warn

      - name: Upload UI test results and mock log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-results
          path: |
            TestResults.xcresult
            ${{ runner.temp }}/reminder-mock.log
            build.log
          if-no-files-found: warn

      - name: Package IPA (unsigned, from archive)
        run: |
          APP_PATH=$(find "$PWD/build/ReminderApp.xcarchive/Products/Applications" -name '*.app' -type d -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in archive!"
            find "$PWD/build/ReminderApp.xcarchive" -name '*.app' -type d
            exit 1
          fi
          echo "Found: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # 复制 SwiftSupport 到 IPA 根（与 Payload 平级），提升自签工具兼容性
          SWIFT_DIR="$PWD/build/ReminderApp.xcarchive/SwiftSupport"
          if [ -d "$SWIFT_DIR" ]; then
            cp -R "$SWIFT_DIR" SwiftSupport
            echo "SwiftSupport copied"
          fi
          # 清除 macOS 可能写入的 AppleDouble 资源文件，避免严格自签工具报“文件错误”
          find Payload -name '._*' -delete
          if [ -d SwiftSupport ]; then
            zip -r ReminderApp.ipa Payload SwiftSupport
          else
            zip -r ReminderApp.ipa Payload
          fi
          rm -rf Payload SwiftSupport

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReminderApp-unsigned.ipa
          path: ReminderApp.ipa
          retention-days: 30

      - name: Prepare versioned release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp ReminderApp.ipa "ReminderApp-${VERSION}.ipa"

      - name: Upload to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 只挂带版本号的那一份；裸名（ReminderApp.ipa）作为 build artifact 已上传，不重复出现在 Release
          files: ReminderApp-${{ env.VERSION }}.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
