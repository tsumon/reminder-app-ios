name: Build iOS IPA

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Fix Homebrew tap trust issue
        run: brew untap aws/tap 2>/dev/null; true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run lunar calendar regression check
        run: |
          # macOS 命令行工具：无需 iOS 模拟器（runner 无预建设备且部分 runtime 不兼容），
          # 直接编译产品代码 LunarCalendar.swift 跑权威农历事实断言
          xcodebuild build \
            -project ReminderApp.xcodeproj \
            -scheme LunarCalendarCheck \
            -destination 'platform=macOS' \
            -derivedDataPath ./DerivedDataTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
          BIN=$(find ./DerivedDataTests/Build/Products -name 'LunarCalendarCheck' -type f | head -1)
          echo "Running: $BIN"
          "$BIN"

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project ReminderApp.xcodeproj \
            -scheme ReminderApp \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""

      - name: Locate .app
        run: find ./DerivedData -name '*.app' -type d

      - name: Package IPA
        run: |
          APP_PATH=$(find ./DerivedData -name '*.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found!"
            exit 1
          fi
          echo "Found: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ReminderApp.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReminderApp.ipa
          path: ReminderApp.ipa
          retention-days: 30

      - name: Upload to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ReminderApp.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
